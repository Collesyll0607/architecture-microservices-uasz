server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Fichiers statiques et images : support optimal des chemins /images/ et /assets/
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Support du routage Angular (HTML5 pushState)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy vers ms-patrimoine (Port 8081) pour patrimoines et authentification
    location /api/patrimoines {
        proxy_pass http://ms-patrimoine:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/auth {
        proxy_pass http://ms-patrimoine:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy vers ms-circuit (Port 8082)
    location /api/circuits {
        proxy_pass http://ms-circuit:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy vers ms-evenement (Port 8083)
    location /api/evenements {
        proxy_pass http://ms-evenement:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy vers ms-reservation (Port 8084)
    location /api/reservations {
        proxy_pass http://ms-reservation:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
